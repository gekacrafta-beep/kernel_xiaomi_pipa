name: Build Pipa Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu

    - name: Download and Setup AOSP Clang
      run: |
        # Скачиваем официальный Clang из AOSP (версия r487747c)
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz -O clang.tar.gz
        mkdir -p $GITHUB_WORKSPACE/clang
        tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/clang
        rm clang.tar.gz

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # Создаем папку для сборки
        mkdir -p out

        # Конфигурация
        make O=out ARCH=arm64 pipa_defconfig

        # Сама сборка (используем LLVM=1 и LLVM_IAS=1 для встроенного ассемблера)
        make O=out ARCH=arm64 -j$(nproc) LLVM=1 LLVM_IAS=1

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: out/arch/arm64/boot/Image
